# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Read harper-ls pin
      id: harper
      run: grep -E '^HARPER_(VERSION|BINARY_SHA256)=' Vendor/harper-ls/harper-ls.pin >> "$GITHUB_OUTPUT"
    - name: Cache harper-ls
      uses: actions/cache@v4
      with:
        path: Vendor/harper-ls/bin
        key: harper-ls-${{ steps.harper.outputs.HARPER_VERSION }}-${{ steps.harper.outputs.HARPER_BINARY_SHA256 }}-${{ runner.arch }}
    - name: Fetch harper-ls (sha256-verified, also on cache hit)
      run: script/fetch_harper_ls.sh
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  ios:

    runs-on: macos-latest
    permissions:
      contents: write   # only to attach the IPA to a v* release

    steps:
    - uses: actions/checkout@v4
    - name: Build unsigned IPA (app + keyboard, for AltStore/Sideloadly)
      run: ./script/create_ipa.sh
    - uses: actions/upload-artifact@v4
      with:
        name: Nogrammerly-iOS-unsigned
        path: dist/Nogrammerly-iOS-unsigned.ipa
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: gh release upload "$TAG" dist/Nogrammerly-iOS-unsigned.ipa --clobber
