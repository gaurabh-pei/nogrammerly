# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  ios:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build unsigned IPA (app + keyboard, for AltStore/Sideloadly)
      run: ./script/create_ipa.sh
    - uses: actions/upload-artifact@v4
      with:
        name: Nogrammerly-iOS-unsigned
        path: dist/Nogrammerly-iOS-unsigned.ipa
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release upload ${{ github.ref_name }} dist/Nogrammerly-iOS-unsigned.ipa --clobber
