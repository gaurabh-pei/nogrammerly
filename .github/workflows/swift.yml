# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v

  ios:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build iOS app and keyboard (simulator, unsigned)
      run: xcodebuild -project iOS/Nogrammerly.xcodeproj -scheme NogrammerlyiOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
