ght="700" class="ink" text-anchor="start" xml:space="preserve" textLength="73.8" lengthAdjust="spacingAndGlyphs">Platforms</text><circle cx="360" cy="423.0" r="11" class="good"/><path d="M355 423.0 l3.5 3.5 l6.5 -7" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><text x="382" y="428.5" font-size="15" font-weight="700" class="ink" text-anchor="start" xml:space="preserve" textLength="129.9" lengthAdjust="spacingAndGlyphs">Mac and Windows</text><circle cx="658" cy="423.0" r="11" class="meh"/><path d="M653.5 423.0 h9" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="680" y="428.5" font-size="15" class="muted" text-anchor="start" xml:space="preserve" textLength="41.4" lengthAdjust="spacingAndGlyphs">Varies</text></svg>
