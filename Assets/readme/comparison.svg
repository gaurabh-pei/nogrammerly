<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img"><title>Nogrammerly compared with cloud writing assistants</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
