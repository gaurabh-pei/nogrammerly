<svg xmlns="http://www.w3.org/2000/svg" width="920" height="384" viewBox="0 0 920 384" role="img"><title>Cloud assistants upload your text to their servers; Nogrammerly keeps it on your device</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs><style>
.card{fill:#ffffff;stroke:#e4e4f0}
.ink{fill:#1f2340}.muted{fill:#6b6f85}.line{stroke:#ececf4}
.tint{fill:#f3f1ff;stroke:#7c6cf6}
.good{fill:#16a34a}.bad{fill:#e5484d}.meh{fill:#9ca3af}
.box{fill:#f7f7fb;stroke:#dcdcea}
.safe{fill:#effaf3;stroke:#22a559}.risk{fill:#fff4f3;stroke:#e5484d}
.goodtxt{fill:#15803d}.badtxt{fill:#c2353a}
@media (prefers-color-scheme: dark){
.card{fill:#161b22;stroke:#30363d}
.ink{fill:#e6edf3}.muted{fill:#9198a1}.line{stroke:#262c36}
.tint{fill:#211d45;stroke:#8b7cff}
.good{fill:#2ea043}.bad{fill:#f85149}.meh{fill:#6e7681}
.box{fill:#1c2129;stroke:#30363d}
.safe{fill:#0f2a1a;stroke:#2ea043}.risk{fill:#2d1517;stroke:#f85149}
.goodtxt{fill:#56d364}.badtxt{fill:#ff7b72}
}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}
</style><rect x="1" y="1" width="918" height="382" rx="22" class="card" stroke-width="1.5"/><text x="36" y="44" font-size="16" font-weight="700" class="badtxt" text-anchor="start" xml:space="preserve">☁️  Cloud writing assistants</text><rect x="56" y="66" width="228" height="66" rx="14" class="box" stroke-width="1.5"/><text x="74" y="107" font-size="22" class="ink" text-anchor="start" xml:space="preserve">⌨️</text><text x="110" y="96" font-size="15" font-weight="700" class="ink" text-anchor="start" xml:space="preserve" textLength="62.2" lengthAdjust="spacingAndGlyphs">You type</text><text x="110" y="116" font-size="12.5" class="muted" text-anchor="start" xml:space="preserve">a Slack DM, an email…</text><rect x="346" y="66" width="228" height="66" rx="14" class="box" stroke-width="1.5"/><text x="364" y="107" font-size="22" class="ink" text-anchor="start" xml:space="preserve">🌐</text><text x="400" y="96" font-size="15" font-weight="700" class="ink" text-anchor="start" xml:space="preserve" textLength="85.8" lengthAdjust="spacingAndGlyphs">The internet</text><text x="400" y="116" font-size="12.5" class="muted" text-anchor="start" xml:space="preserve" textLength="154.9" lengthAdjust="spacingAndGlyphs">every keystroke is uploaded</text><rect x="636" y="66" width="228" height="66" rx="14" class="risk" stroke-width="1.5"/><text x="654" y="107" font-size="22" class="ink" text-anchor="start" xml:space="preserve">🏢</text><text x="690" y="96" font-size="15" font-weight="700" class="ink" text-anchor="start" xml:space="preserve" textLength="94.2" lengthAdjust="spacingAndGlyphs">Their servers</text><text x="690" y="116" font-size="12.5" class="muted" text-anchor="start" xml:space="preserve" textLength="120.2" lengthAdjust="spacingAndGlyphs">processed and stored</text><line x1="292" y1="99" x2="329" y2="99" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M327 93 L338 99 L327 105 z" fill="#e5484d"/><line x1="582" y1="99" x2="619" y2="99" stroke="#e5484d" stroke-width="2.5" stroke-dasharray="6 5"/><path d="M617 93 L628 99 L617 105 z" fill="#e5484d"/><rect x="30" y="196" width="860" height="160" rx="18" class="safe" stroke-width="2" stroke-dasharray="7 6"/><text x="52" y="228" font-size="16" font-weight="700" class="goodtxt" text-anchor="start" xml:space="preserve">🔒  Nogrammerly: everything stays on your Mac or PC</text><rect x="56" y="252" width="228" height="66" rx="14" class="box" stroke-width="1.5"/><text x="74" y="293" font-size="22" class="ink" text-anchor="start" xml:space="preserve">⌨️</text><text x="110" y="282" font-size="15" font-weight="700" class="ink" text-anchor="start" xml:space="preserve" textLength="62.2" lengthAdjust="spacingAndGlyphs">You type</text><text x="110" y="302" font-size="12.5" class="muted" text-anchor="start" xml:space="preserve" textLength="57.7" lengthAdjust="spacingAndGlyphs">in any app</text><rect x="346" y="252" width="228" height="66" rx="14" class="box" stroke-width="1.5"/><text x="364" y="293" font-size="22" class="ink" text-anchor="start" xml:space="preserve">✦</text><text x="400" y="282" font-size="15" font-weight="700" class="ink" text-anchor="start" xml:space="preserve" textLength="96.7" lengthAdjust="spacingAndGlyphs">Nogrammerly</text><text x="400" y="302" font-size="12.5" class="muted" text-anchor="start" xml:space="preserve" textLength="110.1" lengthAdjust="spacingAndGlyphs">rules + on-device AI</text><rect x="636" y="252" width="228" height="66" rx="14" class="box" stroke-width="1.5"/><text x="654" y="293" font-size="22" class="ink" text-anchor="start" xml:space="preserve">✅</text><text x="690" y="282" font-size="15" font-weight="700" class="ink" text-anchor="start" xml:space="preserve" textLength="90.0" lengthAdjust="spacingAndGlyphs">Suggestions</text><text x="690" y="302" font-size="12.5" class="muted" text-anchor="start" xml:space="preserve" textLength="129.2" lengthAdjust="spacingAndGlyphs">underlines and rewrites</text><line x1="292" y1="285" x2="329" y2="285" stroke="#22a559" stroke-width="2.5"/><path d="M327 279 L338 285 L327 291 z" fill="#22a559"/><line x1="582" y1="285" x2="619" y2="285" stroke="#22a559" stroke-width="2.5"/><path d="M617 279 L628 285 L617 291 z" fill="#22a559"/><text x="868" y="340" font-size="13" font-weight="700" class="goodtxt" text-anchor="end" xml:space="preserve" textLength="205.1" lengthAdjust="spacingAndGlyphs">Nothing is sent over the network.</text></svg>
